# 镜像内置的兜底配置：连接信息与密钥通常由环境变量提供
# （compose 的 DB_*/REDIS_*/JWT_SECRET/API_KEY_SECRET 在加载期覆盖本文件）。
server:
  port: 9517
  mode: release

database:
  host: postgres
  port: 5432
  user: airgate
  password: airgate
  dbname: airgate
  sslmode: disable

redis:
  host: redis
  port: 6379
  password: ""
  db: 0
  tls: false

jwt:
  secret: airgate-docker-secret-change-me
  expire_hour: 24

security:
  api_key_secret: ""             # 留空使用内置默认密钥；或填入 hex 编码的 64 字符密钥

log:
  level: info
  format: text
