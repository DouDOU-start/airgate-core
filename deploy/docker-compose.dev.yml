# 开发环境编排 — 源码挂载 + 实时编译
# 使用方式: docker compose -f deploy/docker-compose.dev.yml up
#
# 仅拉起 core + pg + redis + 前端构建。
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: airgate
      POSTGRES_PASSWORD: airgate
      POSTGRES_DB: airgate
    volumes:
      - ../data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airgate -d airgate"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "airgate-dev"]
    volumes:
      - ../data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a airgate-dev --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend-builder:
    image: node:22-bookworm
    working_dir: /workspace
    volumes:
      - ..:/workspace
      - ../data/pnpm_store:/root/.local/share/pnpm/store
    command:
      - bash
      - -lc
      - >-
        set -e;
        corepack enable;
        corepack prepare pnpm@11.1.1 --activate;
        cd /workspace/web && pnpm install --frozen-lockfile && pnpm build
    restart: "no"

  core:
    image: golang:1.26-bookworm
    working_dir: /workspace/backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      frontend-builder:
        condition: service_completed_successfully
    environment:
      # 无 config.yaml：连接信息全部由环境变量提供（config.Load 缺文件时纯 env 启动）
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: airgate
      DB_PASSWORD: airgate
      DB_NAME: airgate
      DB_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: airgate-dev
      JWT_SECRET: airgate-dev-secret
      ANTIGRAVITY_OAUTH_CLIENT_ID: ${ANTIGRAVITY_OAUTH_CLIENT_ID:-}
      ANTIGRAVITY_OAUTH_CLIENT_SECRET: ${ANTIGRAVITY_OAUTH_CLIENT_SECRET:-}
      # 显式放到仓库 data 目录，避免默认落入 backend/data/plugins
      PLUGINS_DIR: /workspace/data/plugins
      GIN_MODE: debug
    volumes:
      - ..:/workspace
      - ../data/go_pkg_mod:/go/pkg/mod
      - ../data/go_build_cache:/root/.cache/go-build
    ports:
      - "9517:9517"
    command:
      - bash
      - -lc
      - /usr/local/go/bin/go run -buildvcs=false ./cmd/server
