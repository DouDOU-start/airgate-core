# AirGate 默认模型价目表种子。
# 单位：USD / 1,000,000 tokens。per_request 为 USD/次（按次计费模型用，token 计费模型填 0）。
# 来源：claude/openai 取自 airgate-openai registry.go + airgate-claude models.go（standalone-gateway 分支提取）；
#   gemini/grok 取自 Google AI / xAI 官方价目（2026-08 快照，调价后可直接改本文件或用后台价目表页）。
# 字段映射：input←InputPrice，output←OutputPrice，cached_input←CachedPrice/CachedInputPrice，
#   cache_creation←claude 的 CacheCreationPrice(5m 缓存写入档，openai 无此档填 0)，
#   cache_creation_1h←claude 的 CacheCreation1hPrice(1h 缓存写入档)，per_request←0。
#   pricing_extra←服务档倍率(service_tiers)+长上下文阶梯(long_context)，长尾维度，多数模型省略。
# 语义：core 启动时 insert-if-absent——只导入价目表里尚不存在的 model，已存在的（含你手动改过的）不覆盖。
# 手动修改：直接编辑本文件后重启即可补入新模型；已存在模型的调价请用后台价目表页或删除该行对应 DB 记录后重启。
#
# 说明：
#   - claude 别名（如 claude-sonnet-4-5）与其规范模型（claude-sonnet-4-5-20250929）同价，
#     二者都作为独立条目导入，因为渠道化 core 按客户端请求的 model 名计价。
#   - openai 纯图像模型：gpt-image-2 按张计费（pricing_extra.image.size_prices 分辨率×质量价表，
#     单位 USD/张）；gpt-image-1 / gpt-image-1.5 未收录，需要时参照 gpt-image-2 条目补行。
#   - openai service_tiers：priority/flex 为整单倍率（priority=2×标准，gpt-5.5=2.5×；flex=0.5×标准）。
#   - openai long_context：仅 gpt-5.4 家族；完整 prompt 超阈值时各维度单价按倍率放大。
